<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>银伴——银行智能服务助手 · 自建坐席工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f2;color:#153c32;font:17px/1.65 system-ui,sans-serif}header,main{max-width:1240px;margin:auto;padding:24px}h1,h2{color:#111;font-weight:800}header{border-bottom:1px solid #c7d9ca}header p{max-width:850px}button,input,textarea,select{font:inherit;border:1px solid #9bb6a5;border-radius:10px;padding:10px;max-width:100%}button{cursor:pointer;background:#12614f;color:white}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #8a6200;outline-offset:3px}input,textarea{width:100%;background:white}textarea{min-height:96px;resize:vertical}#operatorSession{display:grid;grid-template-columns:minmax(220px,340px) minmax(0,1fr);gap:24px}#operatorSession[hidden], [hidden]{display:none!important}.card{background:#fff;border:1px solid #c7d9ca;border-radius:16px;padding:20px;min-width:0}ul{list-style:none;padding:0}li{overflow-wrap:anywhere;border-bottom:1px solid #dce6dc;padding:12px 0}#operatorMessages{max-height:440px;overflow:auto}#operatorMessages li p{white-space:pre-wrap}#operatorMessages li.operator{border-left:4px solid #19775d;padding-left:14px}small{color:#53685b}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}#operatorNotice{padding:14px;background:#e8f0e6;border-radius:10px;overflow-wrap:anywhere}#activeCase{font-size:14px;overflow-wrap:anywhere}label{display:block;margin:12px 0}@media(max-width:740px){#operatorSession{grid-template-columns:1fr}header,main{padding:16px}}
</style></head>
<body><header><p>SELF-HOSTED SUPPORT · 项目本地演示</p><h1>坐席工作台</h1><p>领取工单后与用户交流。这不是银行官方客服；留言和结单都不会转账、退款、修改认证或把未知交易改为成功。</p><a href="/" target="_blank" rel="noopener">打开用户端</a></header>
<main><p id="operatorNotice" role="status" aria-live="polite">请使用服务端配置的本地坐席会话。令牌只保留在当前页面内存。</p>
<section id="operatorLoginPanel" class="card"><h2>进入本地工作台</h2><label for="operatorToken">本地运维会话令牌（不是大模型API密钥）</label><input id="operatorToken" type="password" autocomplete="off" spellcheck="false"><button id="operatorLogin" type="button">核验会话并查看工单</button><p><small>不要输入银行密码、验证码或其他服务的密钥。未配置坐席令牌时无法进入；生产身份认证另行验收。</small></p></section>
<section id="operatorSession" hidden><aside class="card"><h2>工单队列</h2><div class="actions"><button id="operatorRefresh" type="button">刷新工单</button><button id="operatorLogout" type="button">退出会话</button></div><ul id="operatorCases"></ul></aside>
<section class="card"><h2>当前对话</h2><p id="activeCase">先领取或选择工单</p><ul id="operatorMessages" aria-live="polite"></ul><div id="operatorComposer" hidden><label for="operatorText">回复用户</label><textarea id="operatorText" maxlength="2000" placeholder="提供核对指引；不索取密码、验证码、卡号或密钥"></textarea><button id="operatorSend" type="button">发送文字回复</button><hr><label for="operatorResolution">工单记录结论（不改变银行状态）</label><select id="operatorResolution"><option value="GUIDANCE_PROVIDED">已提供指引</option><option value="REFERRED_OFFICIAL">转银行官方渠道</option><option value="NEEDS_RECONCILIATION">仍需核对原交易</option></select><button id="operatorResolve" type="button">记录结论并结单</button><p><small>未知交易只能记录“仍需核对原交易”。对方页面已显示不代表真人已阅读或理解。</small></p></div></section></section>
<section id="operatorAcceptance" class="card" hidden><h2>本次人工验收</h2><p id="acceptanceInstructions"></p><label><input id="humanChecked" type="checkbox" style="width:auto">我已手动操作用户端与坐席端，并核对两边显示的文字。本次可以由同一人扮演两个角色。</label><button id="saveHumanAcceptance" type="button" disabled>保存人工验收元数据并结束</button></section>
</main><script src="/support/operator.js"></script></body></html>
