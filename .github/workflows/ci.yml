name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: core-${{ matrix.os }}-${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, index: 0, count: 1, label: full}
          - {os: windows-2022, index: 0, count: 4, label: shard1}
          - {os: windows-2022, index: 1, count: 4, label: shard2}
          - {os: windows-2022, index: 2, count: 4, label: shard3}
          - {os: windows-2022, index: 3, count: 4, label: shard4}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BANK_AGENT_OFFLINE: '1'
      IDENTITY_MODE: demo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Existing approved optional OCR codec for tests
        run: python -m pip install Pillow==12.3.0
      - name: Whitespace and syntax
        run: |
          git diff --check
          python -m compileall -q app scripts tests
      - name: Core and real subprocess recovery, zero skips
        env:
          BANK_CI_TEST_TIMEOUT_SECONDS: '120'
        run: python scripts/ci_verify.py --scope core --shard-index ${{ matrix.index }} --shard-count ${{ matrix.count }} --output data/verification/ci/core.json
      - name: Existing demo readiness preflight
        run: python scripts/preflight.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: core-${{ matrix.os }}-${{ matrix.label }}
          path: data/verification/ci/
          if-no-files-found: error
          retention-days: 14

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Existing approved browser tooling, fixed versions
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.qa-tools/browsers
        run: |
          set -euo pipefail
          python -m pip install Pillow==12.3.0
          npm install --prefix "$RUNNER_TEMP/bank-browser-qa" --ignore-scripts --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/bank-browser-qa/node_modules/.bin/playwright" install --with-deps chromium
          echo "C7_NODE_BINARY=$(command -v node)" >> "$GITHUB_ENV"
          echo "C7_PLAYWRIGHT_MODULE=$RUNNER_TEMP/bank-browser-qa/node_modules/playwright/index.js" >> "$GITHUB_ENV"
      - name: JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/speech-output.js
          node tests/test_speech_output.js
      - name: Browser tests, zero skips
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.qa-tools/browsers
        run: python scripts/ci_verify.py --scope browser --output data/verification/ci/browser.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-linux
          path: data/verification/ci/
          if-no-files-found: error
          retention-days: 14

  container:
    needs: [core, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build default stdlib image (online build, no optional model assets)
        run: docker build --tag bank-agent:ci .
      - name: Offline Mock flow in isolated container
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp --tmpfs /app/data:rw,mode=1777
          -e BANK_AGENT_DB_PATH=/tmp/ci.sqlite3 -e BANK_AGENT_OFFLINE=1
          bank-agent:ci python scripts/channel_demo.py --qa
